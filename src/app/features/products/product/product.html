<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      @if (product) {
        <div class="card shadow-lg">
          <img [src]="product.image" class="card-img-top" alt="tea">
          <div class="card-body">
            <h2 class="card-title fw-bold">{{ product.title }}</h2>
            <p class="fs-4 text-primary fw-bold">{{ product.price }} руб.</p>
            <p class="card-text">{{ product.description }}</p>
            <a [routerLink]="'/order'" [queryParams]="{ product: product.title }" class="btn btn-primary">Купить</a>
          </div>
        </div>
      } @else {
        <p>Загрузка...</p>
      }
    </div>
  </div>
</div>
