<header>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/">Logo</a>
      <button class="navbar-toggler" type="button" (click)="isMenuCollapsed = !isMenuCollapsed">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" [ngbCollapse]="isMenuCollapsed">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" routerLink="/">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/catalog">Каталог</a>
          </li>
        </ul>
        <form class="d-flex" (submit)="onSearch($event)">
          <input class="form-control me-2" type="search" placeholder="Поиск чая" [value]="searchService.getSearch()">
          <button class="btn btn-outline-primary" type="submit">Найти</button>
        </form>
      </div>
    </div>
  </nav>
</header>
